name: Test

on: [push, pull_request]

# ยกเลิกรันเก่าของ branch เดียวกัน เมื่อมี push ใหม่เข้ามา (กันรันซ้ำเปลือง quota)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -q --cov=app.api.line_bot --cov=app.services.category --cov=app.services.product_cards --cov-report=term-missing --cov-fail-under=85
