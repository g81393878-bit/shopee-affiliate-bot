services:
  - type: web
    name: shopee-affiliate-bot
    env: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false  # Facebook App ID (developers.facebook.com → Basic)
      - key: FACEBOOK_APP_SECRET
        sync: false  # Facebook App Secret — ใช้ตรวจ X-Hub-Signature-256
      - key: FACEBOOK_VERIFY_TOKEN
        sync: false  # รหัสลับตั้งเอง ใช้ verify webhook (ต้องตรงกับใน Facebook App)
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false  # Page Access Token — ใช้ตอบแชทเพจผ่าน Send API (ได้จาก Connect Page)
      - key: LINE_OA_URL
        sync: false  # ลิงก์ LINE OA จริง (https://line.me/R/ti/p/@xxxxx) — ใส่ในข้อความแนะนำบอท
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false  # Claude (บอสใหญ่) — ถ้า LLM_PROVIDER=anthropic; key ตั้งใน Render dashboard เอง
      - key: ANTHROPIC_MODEL
        sync: false  # default claude-opus-5
      - key: CRON_TOKEN
        sync: false
      - key: ADMIN_DASHBOARD_PASSWORD
        sync: false  # รหัสผ่านแดชบอร์ดแอดมิน (/admin) — ไม่ตั้ง = ใช้ CRON_TOKEN แทน
      - key: SHOPEE_AFFILIATE_PARTNER_ID
        sync: false  # Shopee Affiliate Open API (รออนุมัติ → ได้ทางอีเมล)
      - key: SHOPEE_AFFILIATE_SECRET
        sync: false
      - key: TAVILY_API_KEY
        sync: false  # Tavily web search (ค้นข้อมูลเน็ต) — ฟรี 1,000 ครั้ง/เดือน ที่ tavily.com
      - key: FIRECRAWL_API_KEY
        sync: false  # Firecrawl web search สำรอง (ถ้า Tavily ล้ม/หมด quota) — ฟรี ที่ firecrawl.dev
      - key: LLM_PROVIDER
        value: groq
      - key: FB_AUTO_POST_INTERVAL
        value: 60  # นาทีระหว่างโพสต์ Facebook อัตโนมัติ (0 = ปิด) — ลดเหลือ 60 (ทุก 1 ชม.) ชั่วคราวเพื่อทดสอบ (เดิม 240)
      - key: FB_POST_PRODUCTS
        value: ""  # ตั้งเป็น 1 เพื่อเปิด Phase 2 โพสต์ขายสินค้า (หลังโพสต์แนะนำตัวครบ) — ตอนนี้ปิดไว้
      - key: POSTS_SHEET_WEBHOOK_URL
        sync: false  # URL Apps Script บันทึกโพสต์ลง Google ชีท (tools/sheet_posts_apps_script.gs) — ไม่ตั้ง = ไม่บันทึก
