services:
  - type: web
    name: shopee-affiliate-bot
    env: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CRON_TOKEN
        sync: false
      - key: ADMIN_DASHBOARD_PASSWORD
        sync: false  # รหัสผ่านแดชบอร์ดแอดมิน (/admin) — ไม่ตั้ง = ใช้ CRON_TOKEN แทน
      - key: LLM_PROVIDER
        value: groq
