<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ป้าเข็ม — ผู้ช่วยปิดการขายในแชท & เปิดบิลรับออเดอร์</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header" style="background: linear-gradient(135deg, #0d47a1, #1976d2);">
    <div class="header-title">
      🐟 ป้าเข็ม: ผู้ช่วยปิดการขายในแชท
      <span class="badge-ver">v8.3</span>
    </div>
  </div>

  <div class="content">
    <!-- 🔍 การ์ดที่ 1: ดึงข้อมูลจากแชท + เปิดบิลรับออเดอร์ -->
    <div class="card" style="border: 1.5px solid #0d47a1; background: #f8fafd;">
      <div class="card-title" style="color: #0d47a1;">
        <span>🧾 ดึงข้อมูลลูกค้า & เปิดบิลรับออเดอร์</span>
        <button id="btn-clear-form" style="background: transparent; border: none; color: #6c757d; font-size: 10px; cursor: pointer;">🧹 ล้างฟอร์ม</button>
      </div>

      <button id="btn-extract-chat" style="width: 100%; background: linear-gradient(135deg, #0062cc, #007bff); color: #fff; border: none; border-radius: 6px; padding: 8px 6px; font-weight: bold; font-size: 11.5px; cursor: pointer; margin-bottom: 8px;">
        🔍 ดึงชื่อ-ที่อยู่-เบอร์โทรจากหน้าแชทนี้
      </button>

      <div style="display: flex; gap: 5px; margin-bottom: 5px;">
        <input type="text" id="ord-name" placeholder="👤 ชื่อลูกค้า" style="flex: 1; padding: 6px; font-size: 11px; border: 1px solid #ced4da; border-radius: 6px; background: #fff;">
        <input type="text" id="ord-phone" placeholder="📞 เบอร์โทร 10 หลัก" style="flex: 1; padding: 6px; font-size: 11px; border: 1px solid #ced4da; border-radius: 6px; background: #fff; font-weight: bold;">
      </div>

      <textarea id="ord-addr" placeholder="📍 ที่อยู่จัดส่ง (บ้านเลขที่ หมู่/ซอย ตำบล อำเภอ จังหวัด รหัสไปรษณีย์)" style="width: 100%; height: 48px; padding: 6px; font-size: 11px; border: 1px solid #ced4da; border-radius: 6px; background: #fff; resize: none; margin-bottom: 6px; font-family: inherit;"></textarea>

      <select id="ord-pkg" style="width: 100%; padding: 6px; font-size: 11px; font-weight: bold; border: 1px solid #28a745; border-radius: 6px; background: #e8f5e9; color: #1b5e20; margin-bottom: 8px; cursor: pointer;">
        <option value="SKU-SLID-MD-1KG|TRANSFER|550|ปลาสลิดแดดเดียว ชุดยอดฮิต 1 กิโลกรัม (โอนส่งฟรี)">⭐ ชุด 1 กก. (4–6 ตัวใหญ่ คัดพิเศษ) — โอน 550.- ส่งฟรี EMS</option>
        <option value="SKU-SLID-MD-500G|TRANSFER|390|ปลาสลิดแดดเดียว ชุดพอดีมื้อ 500 กรัม (โอนส่งฟรี)">🐟 ชุด 500g (2–3 ตัวใหญ่ คัดพิเศษ) — โอน 390.- ส่งฟรี EMS</option>
        <option value="SKU-SLID-MD-2KG|TRANSFER|1090|ปลาสลิดแดดเดียว ชุดตุนสุดคุ้ม 2 กิโลกรัม (ส่งฟรีรถห้องเย็น)">❄️ ชุด 2 กก. (8–12 ตัวใหญ่ คัดพิเศษ) — โอน 1,090.- ส่งฟรีรถห้องเย็น</option>
      </select>

      <button id="btn-submit-order" style="width: 100%; background: linear-gradient(135deg, #1b5e20, #28a745); color: #fff; border: none; border-radius: 6px; padding: 9px 6px; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 0 2px 6px rgba(40,167,69,0.3);">
        💾 บันทึกออเดอร์ + ส่งบิลสรุปยอดเข้าแชท
      </button>
    </div>

    <!-- ⚡ การ์ดที่ 2: ข้อความตอบแชทด่วน 1-คลิก -->
    <div class="card">
      <div class="card-title">
        <span>⚡ ส่งข้อความตอบแชทด่วน 1-คลิก</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 6px;">
        <button id="btn-reply-price" style="background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; border-radius: 6px; padding: 6px 4px; font-size: 11px; font-weight: bold; cursor: pointer;">
          📋 แจ้งราคา 3 ชุด
        </button>
        <button id="btn-reply-bank" style="background: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 6px; padding: 6px 4px; font-size: 11px; font-weight: bold; cursor: pointer;">
          🏦 เลขบัญชีกรุงไทย
        </button>
        <button id="btn-reply-ask-addr" style="background: #e8f4fd; color: #004085; border: 1px solid #b8daff; border-radius: 6px; padding: 6px 4px; font-size: 11px; font-weight: bold; cursor: pointer;">
          📍 ขอชื่อ-ที่อยู่ลูกค้า
        </button>
        <button id="btn-reply-shipping" style="background: #f3e5f5; color: #4a148c; border: 1px solid #e1bee7; border-radius: 6px; padding: 6px 4px; font-size: 11px; font-weight: bold; cursor: pointer;">
          ❄️ แจ้งรอบส่ง/วิธีเก็บ
        </button>
      </div>

      <div style="display: flex; gap: 5px; margin-bottom: 6px;">
        <button id="btn-copy-img" class="action-btn btn-copy-img" style="flex: 1; padding: 6px;">🖼️ ก๊อปรูปป้ายราคา</button>
        <button id="btn-copy-fried" class="action-btn btn-copy-fried" style="flex: 1; padding: 6px;">🍳 ก๊อปรูปปลาทอด</button>
      </div>

      <button id="btn-invite-likers" style="width: 100%; background: linear-gradient(135deg, #e65100, #f57c00); color: #fff; border: none; border-radius: 6px; padding: 8px 6px; font-weight: bold; font-size: 11.5px; cursor: pointer;">
        👍 เชิญคนถูกใจโพสต์ให้ติดตามเพจ (1-คลิก)
      </button>
    </div>

    <!-- 📜 การ์ดที่ 3: ประวัติออเดอร์ที่บันทึกแล้ว + ส่งออก CSV -->
    <div class="card">
      <div class="card-title">
        <span>📜 ประวัติออเดอร์ล่าสุด (<span id="orders-count">0</span>)</span>
        <button id="btn-export-orders-csv" style="background: #17a2b8; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 10px; font-weight: bold; cursor: pointer;">
          📥 โหลด CSV
        </button>
      </div>
      <div id="orders-history-list" style="max-height: 110px; overflow-y: auto; font-size: 11px; color: #444;">
        กำลังโหลดประวัติออเดอร์...
      </div>
    </div>

    <div id="popup-toast" class="toast">
      💡 กด "🔍 ดึงชื่อ-ที่อยู่-เบอร์โทร" เพื่อสกัดข้อมูลจากแชทอัตโนมัติ
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
