<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ป้ายพื้นหลัง -->
  <circle cx="256" cy="256" r="248" fill="#FBF3E6"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#F2692B" stroke-width="10"/>

  <!-- ผม + มวย -->
  <circle cx="256" cy="152" r="94" fill="#4A3123"/>
  <circle cx="256" cy="66" r="30" fill="#4A3123"/>

  <!-- ไหล่ + ผ้ากันเปื้อน -->
  <path d="M118 512 C118 398 176 362 256 362 C336 362 394 398 394 512 Z" fill="#F2692B"/>
  <path d="M200 368 Q256 344 312 368 Q256 392 200 368 Z" fill="#E05A1F"/>
  <!-- ป้ายชื่อ + สโลแกน -->
  <rect x="46" y="440" width="420" height="62" rx="31" fill="#4A3123"/>
  <text x="256" y="464" text-anchor="middle" font-family="Leelawadee UI, Tahoma, sans-serif" font-size="19" font-weight="bold" fill="#F6C445">ป้าเข็ม ขายของ</text>
  <text x="256" y="490" text-anchor="middle" font-family="Leelawadee UI, Tahoma, sans-serif" font-size="23" font-weight="bold" fill="#FBF3E6">ถ้าไม่คุ้ม ป้าบอกให้</text>

  <!-- เข็มกลัด (signature: ป้าเข็ม) -->
  <g transform="translate(178 388) rotate(-25)">
    <line x1="0" y1="0" x2="0" y2="26" stroke="#C2CAD4" stroke-width="7" stroke-linecap="round"/>
    <polygon points="-4,26 4,26 0,35" fill="#C2CAD4"/>
    <ellipse cx="0" cy="0" rx="5" ry="7.5" fill="none" stroke="#8A939E" stroke-width="3.5"/>
    <path d="M-2,-4 C-12,-12 -22,-10 -27,-1" fill="none" stroke="#F2692B" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- ใบหน้า -->
  <circle cx="256" cy="200" r="86" fill="#F6CBA0"/>

  <!-- แก้มแดง -->
  <circle cx="196" cy="224" r="12" fill="#F2A098" opacity="0.6"/>
  <circle cx="316" cy="224" r="12" fill="#F2A098" opacity="0.6"/>

  <!-- แว่นตา -->
  <circle cx="224" cy="194" r="22" fill="#FFFFFF" fill-opacity="0.55" stroke="#3A2A22" stroke-width="4"/>
  <circle cx="288" cy="194" r="22" fill="#FFFFFF" fill-opacity="0.55" stroke="#3A2A22" stroke-width="4"/>
  <line x1="246" y1="194" x2="266" y2="194" stroke="#3A2A22" stroke-width="4"/>

  <!-- ตา -->
  <circle cx="224" cy="196" r="5" fill="#3A2A22"/>
  <circle cx="288" cy="196" r="5" fill="#3A2A22"/>

  <!-- คิ้ว -->
  <path d="M202 170 Q224 160 246 170" fill="none" stroke="#4A3123" stroke-width="6" stroke-linecap="round"/>
  <path d="M266 170 Q288 160 310 170" fill="none" stroke="#4A3123" stroke-width="6" stroke-linecap="round"/>

  <!-- รอยยิ้ม -->
  <path d="M234 238 Q256 260 278 238" fill="none" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>

  <!-- อุปกรณ์: แว่นขยาย (ซ้าย) -->
  <circle cx="150" cy="150" r="30" fill="#FFFFFF" fill-opacity="0.75" stroke="#3A2A22" stroke-width="6"/>
  <line x1="172" y1="172" x2="194" y2="194" stroke="#3A2A22" stroke-width="9" stroke-linecap="round"/>

  <!-- อุปกรณ์: หัวใจ (ขวา) -->
  <g transform="translate(368 132) scale(1.05)">
    <path d="M16 29 C 16 29 0 19 0 9 C 0 3 5 0 9 0 C 12 0 14 2 16 5 C 18 2 20 0 23 0 C 27 0 32 3 32 9 C 32 19 16 29 16 29 Z" fill="#E74C3C"/>
  </g>
</svg>
